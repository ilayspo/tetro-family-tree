<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ניהול עץ המשפחה של משפחת טטרו</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin.css"><script defer src="/admin.js"></script></head><body><header class="topbar"><div class="brand">✦ ניהול משפחת טטרו</div><a class="admin-link" href="/tree.html">חזרה לעץ</a></header><main class="admin-main"><h1>בניית העץ</h1><p>הוסיפו אדם, בחרו איך הוא קשור למשפחה, ובדקו את הסיכום לפני השמירה.</p><p id="status" role="status" aria-live="polite"></p><form id="login" class="admin-box"><h2>כניסת מנהל</h2><label>דוא״ל<input name="email" type="email" autocomplete="email" required></label><label>סיסמה<input name="password" type="password" autocomplete="current-password" required></label><button>כניסה</button></form><section id="editor" hidden><div class="admin-toolbar"><input id="filter" type="search" placeholder="חיפוש אדם בעץ" aria-label="חיפוש אדם"><button id="new-person" type="button">+ הוספת אדם</button><button id="logout" type="button" class="secondary">יציאה</button></div><div class="admin-layout"><div id="person-list" class="admin-list"></div><div class="admin-detail"><form id="person-form" class="admin-box"><h2 id="editor-title">הוספת אדם</h2><label>שם בעברית<input name="name_he" required minlength="2"></label><label>שם ברוסית (לא חובה כרגע)<input name="name_ru"></label><div class="two-fields"><label>תאריך לידה<input name="birth_date" placeholder="שנה / חודש.שנה / יום.חודש.שנה"></label><label>תאריך פטירה<input name="death_date" placeholder="אם ידוע"></label></div><label>מצב חיים<select name="deceased"><option value="">לא ידוע</option><option value="false">בחיים</option><option value="true">נפטר/ה</option></select></label><label class="check"><input name="is_visible" type="checkbox">להציג באתר המשפחה</label><fieldset id="initial-link"><legend>איך האדם החדש קשור למישהו בעץ?</legend><label>סוג הקשר<select name="kind"><option value="">אקשר אחר כך</option><option value="child">ילד/ה של</option><option value="parent">הורה של</option><option value="partner">בן/בת זוג של</option></select></label><label>אדם שכבר בעץ<select name="target"></select></label><label>הורה שני, אם ידוע<select name="other"></select></label><label>או: זוג הורים קיים<select name="couple"></select></label><p class="field-help">בחירה בהורה אחד משאירה את ההורה השני לא ידוע.</p></fieldset><p id="save-summary" class="field-help"></p><div class="admin-actions"><button type="submit">שמירת פרופיל וקשרים</button><button id="visibility-toggle" type="button" class="secondary" hidden>הסתרה / שחזור</button><button id="delete-person" type="button" class="danger" hidden>מחיקת פרופיל</button></div></form><section id="connections" class="admin-box" hidden><h2>קשרים ועריכה</h2><div id="family-list"></div><form id="connection-form"><h3>הוספת קשר לאדם הזה</h3><label>קשר<select name="kind"><option value="child">האדם הזה ילד/ה של</option><option value="parent">האדם הזה הורה של</option><option value="partner">בן/בת זוג של</option></select></label><label>אדם אחר<select name="target" required></select></label><label>הורה שני (אם ידוע)<select name="other"></select></label><label>מצב הזוגיות<select name="status"><option value="unknown">לא ידוע</option><option value="married">נשואים</option><option value="partnered">בני זוג</option><option value="divorced">גרושים</option><option value="separated">פרודים</option><option value="former">קשר קודם</option></select></label><label>הקשר כיום<select name="current"><option value="">לא ידוע</option><option value="true">נוכחי</option><option value="false">לא נוכחי</option></select></label><button>הוספת קשר</button></form><hr><h3>תמונה</h3><img id="photo-preview" class="photo-preview" alt="תמונת פרופיל" hidden><form id="photo-form"><input name="file" type="file" accept="image/jpeg,image/png,image/webp" required><button>העלאת תמונה עד 5MB</button></form><button id="remove-photo" type="button" class="secondary">הסרת תמונה</button></section></div></div></section></main></body></html>
